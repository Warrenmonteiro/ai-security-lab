name: pdf-tools CI

on:
  push:
    paths: ["pdf-tools/**", ".github/workflows/pdf-tools.yml"]
  pull_request:
    paths: ["pdf-tools/**", ".github/workflows/pdf-tools.yml"]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-tools
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install dependencies from the lock file
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -v
